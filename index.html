<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="display">0</div>
      <div class="buttons">
        <div class="row">
          <div class="btn delete-input" id="clear">AC</div>
          <div class="btn delete-input" id="del">DEL</div>
          <div class="btn input" id="neg">+/-</div>
          <div class="btn operator" id="add">+</div>
        </div>
        <div class="row">
          <div class="btn input" id="num-7">7</div>
          <div class="btn input" id="num-8">8</div>
          <div class="btn input" id="num-9">9</div>
          <div class="btn operator" id="sub">-</div>
        </div>
        <div class="row">
          <div class="btn input" id="num-4">4</div>
          <div class="btn input" id="num-5">5</div>
          <div class="btn input" id="num-6">6</div>
          <div class="btn operator" id="mult">*</div>
        </div>
        <div class="row">
          <div class="btn input" id="num-1">1</div>
          <div class="btn input" id="num-2">2</div>
          <div class="btn input" id="num-3">3</div>
          <div class="btn operator" id="div">/</div>
        </div>
        <div class="row">
          <div class="btn input" id="num-0">0</div>
          <div class="btn input" id="decimal">.</div>
          <div class="btn evaluate" id="equals">=</div>
        </div>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
